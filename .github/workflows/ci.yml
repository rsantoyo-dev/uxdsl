name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install root, packages and fixtures
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          for p in uxdsl uxdsl-vscode playground-nextjs; do
            (cd "packages/$p" && npm ci --ignore-scripts --no-audit --no-fund)
          done
          (cd fixtures/mig02-nextjs-cssmodules && npm install --ignore-scripts --no-audit --no-fund)
      - name: Build the package
        run: npm --prefix packages/uxdsl run build
      - name: Prepare the consumer fixture (packs uxdsl, installs the tarball)
        run: node fixtures/mig07-consumer/run.js
      - name: Test
        run: |
          set +e
          npm test > /tmp/test.log 2>&1
          status=$?
          grep -n -E -B2 -A30 "^not ok|^# fail [1-9]|not ok [0-9]|Stale|npm ERR|ERR!|Error:|failed" /tmp/test.log | head -300 > /tmp/fail.txt
          tail -40 /tmp/test.log >> /tmp/fail.txt
          msg=$(sed -e 's/%/%25/g' -e 's/\r//g' /tmp/fail.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=npm test output::$msg"
          exit $status

  gate:
    name: verify:1.0 (one tarball, real Chrome)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UXDSL_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install root, packages and fixtures
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          for p in uxdsl playground-nextjs; do
            (cd "packages/$p" && npm ci --ignore-scripts --no-audit --no-fund)
          done
          (cd fixtures/mig02-nextjs-cssmodules && npm install --ignore-scripts --no-audit --no-fund)
      - name: Release gate
        run: npm run verify:1.0
