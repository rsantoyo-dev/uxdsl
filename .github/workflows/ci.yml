name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      # npm 10.8 (Node 20's) fails inside its own resolver ("Cannot read
      # properties of null (reading 'edgesOut')", in #loadPeerSet) when it
      # installs the uxdsl tarball into an empty project and walks optional
      # peers; npm 11 installs the same tarball.
      - name: npm 11
        run: npm install -g npm@11 && npm -v
      - name: Install root, packages and fixtures
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          for p in uxdsl uxdsl-vscode playground-nextjs; do
            (cd "packages/$p" && npm ci --ignore-scripts --no-audit --no-fund)
          done
          (cd fixtures/mig02-nextjs-cssmodules && npm install --ignore-scripts --no-audit --no-fund)
      - name: Build the package
        run: npm --prefix packages/uxdsl run build
      - name: Prepare the consumer fixture (packs uxdsl, installs the tarball)
        run: node fixtures/mig07-consumer/run.js
      - name: Test
        run: |
          set +e
          npm test > /tmp/test.log 2>&1
          status=$?
          enc() { sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}'; }
          first=$(grep -n "^not ok" /tmp/test.log | grep -v "# TODO" | head -1 | cut -d: -f1)
          if [ -n "$first" ]; then echo "::error title=first failure::$(sed -n "$((first-2)),$((first+40))p" /tmp/test.log | cut -c1-160 | enc)"; fi
          echo "::error title=log tail::$(tail -30 /tmp/test.log | cut -c1-160 | enc)"
          exit $status

  gate:
    name: verify:1.0 (one tarball, real Chrome)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UXDSL_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      # npm 10.8 (Node 20's) fails inside its own resolver ("Cannot read
      # properties of null (reading 'edgesOut')", in #loadPeerSet) when it
      # installs the uxdsl tarball into an empty project and walks optional
      # peers; npm 11 installs the same tarball.
      - name: npm 11
        run: npm install -g npm@11 && npm -v
      - name: Install root, packages and fixtures
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          for p in uxdsl playground-nextjs; do
            (cd "packages/$p" && npm ci --ignore-scripts --no-audit --no-fund)
          done
          (cd fixtures/mig02-nextjs-cssmodules && npm install --ignore-scripts --no-audit --no-fund)
      - name: Release gate
        run: npm run verify:1.0
