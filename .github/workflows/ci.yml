name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install root, packages and fixtures
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          for p in postcss-uxdsl uxdsl-core uxdsl-cli vite-plugin-uxdsl uxdsl-webpack-loader uxdsl-vscode playground-nextjs; do
            (cd "packages/$p" && npm ci --ignore-scripts --no-audit --no-fund)
          done
          (cd fixtures/mig02-nextjs-cssmodules && npm install --ignore-scripts --no-audit --no-fund)
          (cd fixtures/mig07-consumer && npm install --ignore-scripts --no-audit --no-fund)
      - name: Build the compiler and core
        run: |
          npm --prefix packages/postcss-uxdsl run build
          npm --prefix packages/uxdsl-core run build
      - name: Test
        run: npm test

  gate:
    name: verify:beta7 (real tarballs, real Chrome)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UXDSL_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install root, packages and fixtures
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          for p in postcss-uxdsl uxdsl-core uxdsl-cli vite-plugin-uxdsl uxdsl-webpack-loader playground-nextjs; do
            (cd "packages/$p" && npm ci --ignore-scripts --no-audit --no-fund)
          done
          (cd fixtures/mig02-nextjs-cssmodules && npm install --ignore-scripts --no-audit --no-fund)
      - name: Release gate
        run: npm run verify:beta7
