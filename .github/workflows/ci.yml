name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      # npm 10.8 (Node 20's) fails inside its own resolver ("Cannot read
      # properties of null (reading 'edgesOut')", in #loadPeerSet) when it
      # installs the uxdsl tarball into an empty project and walks optional
      # peers; npm 11 installs the same tarball.
      - name: npm 11
        run: npm install -g npm@11 && npm -v
      - name: Install root, packages and fixtures
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          for p in uxdsl uxdsl-vscode playground-nextjs; do
            (cd "packages/$p" && npm ci --ignore-scripts --no-audit --no-fund)
          done
          (cd fixtures/mig02-nextjs-cssmodules && npm install --ignore-scripts --no-audit --no-fund)
      - name: Build the package
        run: npm --prefix packages/uxdsl run build
      - name: Prepare the consumer fixture (packs uxdsl, installs the tarball)
        run: node fixtures/mig07-consumer/run.js
      - name: Test
        run: npm test

  gate:
    name: verify:1.0 (one tarball, real Chrome)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UXDSL_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      # npm 10.8 (Node 20's) fails inside its own resolver ("Cannot read
      # properties of null (reading 'edgesOut')", in #loadPeerSet) when it
      # installs the uxdsl tarball into an empty project and walks optional
      # peers; npm 11 installs the same tarball.
      - name: npm 11
        run: npm install -g npm@11 && npm -v
      - name: Install root, packages and fixtures
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          for p in uxdsl playground-nextjs; do
            (cd "packages/$p" && npm ci --ignore-scripts --no-audit --no-fund)
          done
          (cd fixtures/mig02-nextjs-cssmodules && npm install --ignore-scripts --no-audit --no-fund)
      - name: Release gate
        run: npm run verify:1.0

  windows:
    name: npm test (uxdsl, Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # Git for Windows may default core.autocrlf to true; the oracles, the
      # generated-artifact checks and the hashed fixtures compare LF bytes.
      - name: Check out with LF line endings, as on ubuntu
        run: |
          git config --show-origin --get core.autocrlf || true
          git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: npm 11
        run: npm install -g npm@11 && npm -v
      # npm's default script shell on Windows is cmd.exe. The scripts npm runs
      # here, the package's build and the prepack of the npm pack a test
      # starts, run with bash instead, as on ubuntu. The test groups do not
      # go through npm: the next step but one runs them from bash, which
      # expands their globs.
      - name: npm runs the package's scripts with bash, as on ubuntu
        run: npm config set script-shell "$(cygpath -w "$(command -v bash)")"
      - name: The tree has ubuntu's line endings
        run: |
          n=$(git ls-files --eol | grep -c 'w/crlf' || true)
          echo "files checked out with CRLF: $n"
          test "$n" = 0
      - name: Install the root and the package
        id: install
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          (cd packages/uxdsl && npm ci --ignore-scripts --no-audit --no-fund)
      # The package's test script, its six groups in its order, inside the
      # guard, which sets TMPDIR, TMP and TEMP to a directory of its own and
      # fails a passing run that leaves an entry there. One file is excluded
      # from this job's pass/fail and still runs, after the gate, with its
      # whole output, its exit and what it leaves printed: on win32 one save
      # reaches build --watch as two change events, and the tests of
      # watch-mode.test.js count builds. The step fails when the package's
      # test script is no longer the one it runs.
      - name: Test the package
        run: |
          set +e
          expected='npm run build && node --test test/*.test.js && node --test test/core/*.test.js && node --test test/cli/*.test.js && node --test test/vite/*.test.js && node --test test/webpack/*.test.js && node --test --test-concurrency=1 test/performance/*.test.js'
          actual=$(node -p "require('./packages/uxdsl/package.json').scripts.test")
          if [ "$actual" != "$expected" ]; then
            echo "the package's test script is not the one this step runs: $actual"
            exit 1
          fi
          suites=$(mktemp "$(cygpath -u "$TEMP")/uxdsl-suites.XXXXXX") || exit 1
          cat > "$suites" << 'EOF'
          cd packages/uxdsl || exit 1
          cli=$(ls test/cli/*.test.js | grep -vx 'test/cli/watch-mode.test.js')
          npm run build && node --test test/*.test.js && node --test test/core/*.test.js && node --test $cli && node --test test/vite/*.test.js && node --test test/webpack/*.test.js && node --test --test-concurrency=1 test/performance/*.test.js
          EOF
          node scripts/tmpdir-guard.js "$(cygpath -d "$(command -v bash)")" "$(cygpath -w "$suites")"
          gate=$?
          rm -f "$suites"
          d=$(mktemp -d "$(cygpath -u "$TEMP")/uxdsl-excluded.XXXXXX") || exit 1
          w=$(cygpath -w "$d")
          (cd packages/uxdsl && TMPDIR="$w" TMP="$w" TEMP="$w" timeout -k 30 1200 node --test test/cli/watch-mode.test.js) > "$d.out" 2>&1
          code=$?
          cat "$d.out"
          echo "excluded from the Windows gate: watch-mode.test.js, one save reaches build --watch as two change events on win32; MIG-B9-06 returns it to the gate"
          grep -E '^# (tests|pass|fail|skipped) ' "$d.out" | sed 's/^/watch-mode.test.js: /'
          echo "watch-mode.test.js: exit $code, left $(ls -A "$d" | wc -l | tr -d ' ')"
          rm -rf "$d" "$d.out"
          exit "$gate"
      # Each test file alone, in a directory of its own under the runner's
      # TEMP, which keeps its 8.3 short name: a line "exit N: <step>" or
      # "left N in <directory>: <step>" names the file that failed or left
      # something, and a failing step's output follows its line; a file that
      # runs for more than 20 minutes is stopped, as "exit 124". It runs
      # whether or not the suites passed, once the install has. The file the
      # previous step excludes from the gate prints its whole output and its
      # lines, marked "(excluded from the Windows gate)", and fails nothing.
      - name: Each test file alone leaves nothing in its temporary directory
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: |
          set +e
          base=$(mktemp -d "$(cygpath -u "$TEMP")/uxdsl-loop.XXXXXX") || exit 1
          fail=0
          step() {
            local d w code
            d=$(mktemp -d "$base/step.XXXXXX") || { echo "no step directory: $*"; fail=1; return; }
            w=$(cygpath -w "$d")
            (cd packages/uxdsl && TMPDIR="$w" TMP="$w" TEMP="$w" timeout -k 30 1200 "$@") > "$base/out" 2>&1
            code=$?
            if [ "$code" != 0 ]; then echo "exit $code: $*"; cat "$base/out"; fail=1; fi
            rmdir "$d" 2> /dev/null || { echo "left $(ls -A "$d" | wc -l | tr -d ' ') in $w: $*"; fail=1; }
          }
          excluded() {
            local d w code
            d=$(mktemp -d "$base/excluded.XXXXXX") || { echo "no step directory: $*"; fail=1; return; }
            w=$(cygpath -w "$d")
            (cd packages/uxdsl && TMPDIR="$w" TMP="$w" TEMP="$w" timeout -k 30 1200 "$@") > "$base/out" 2>&1
            code=$?
            cat "$base/out"
            echo "excluded from the Windows gate: watch-mode.test.js, one save reaches build --watch as two change events on win32; MIG-B9-06 returns it to the gate"
            echo "exit $code: $* (excluded from the Windows gate)"
            echo "left $(ls -A "$d" | wc -l | tr -d ' ') in $w: $* (excluded from the Windows gate)"
            rm -rf "$d"
          }
          for f in packages/uxdsl/test/*.test.js packages/uxdsl/test/{core,cli,vite,webpack}/*.test.js; do
            case "$f" in
              packages/uxdsl/test/cli/watch-mode.test.js) excluded node --test "${f#packages/uxdsl/}" ;;
              *) step node --test "${f#packages/uxdsl/}" ;;
            esac
          done
          for f in packages/uxdsl/test/performance/*.test.js; do step node --test --test-concurrency=1 "${f#packages/uxdsl/}"; done
          rm -f "$base/out"
          rmdir "$base" 2> /dev/null
          echo "fail=$fail"
          test "$fail" = 0
