name: Idea
description: Something the theme or a component should be able to say that it cannot today.
labels: [idea]
body:
  - type: textarea
    id: say
    attributes:
      label: What should the theme or the component be able to say?
      description: Write it as you would like to write it, in the theme JSON or in a .uxdsl file.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: The CSS or workaround you use now.
      render: scss
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: The project or design system this comes from, if you can share it.
